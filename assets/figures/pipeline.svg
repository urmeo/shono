<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" fill="none" role="img" aria-labelledby="pipeline-title pipeline-description">
<title id="pipeline-title">Shono pipeline: Bengali audio, transcripts, and evaluation</title>
<desc id="pipeline-description">Prepare local speech datasets by checking source terms, audio paths, timing, and train/test overlap. Build separate train, development, and test manifests. Use an existing Whisper checkpoint or optionally train on the train split with development evaluation using PyTorch and Transformers. Convert weights to CTranslate2 for long recordings. For each long recording, detect speech with Silero, plan chunks no longer than 30 seconds including padding, transcribe with faster-whisper, filter low-confidence chunks, and merge global timestamps. Optionally use pyannote turns intersected with detected speech to label each transcript segment by its dominant speaker. Short clips use Transformers directly. Compare complete predictions against held-out references using raw and normalized word and character error rates. Confidence intervals require at least two recording or speaker blocks. Base, fine-tuned, and optional cloud API predictions feed reports; model cards use those reports. The repository has no project-trained checkpoint or measured model accuracy.</desc>
<rect width="1280" height="1260" fill="#14191C"/>
