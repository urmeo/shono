<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" fill="none" role="img" aria-labelledby="pipeline-title pipeline-description">
<title id="pipeline-title">Shono pipeline: audio to transcripts and evaluation reports</title>
<desc id="pipeline-description">The main path is Bengali audio, Whisper transcription, a transcript, and evaluation reports. Preparation validates local audio, timing and source terms, separates train, development and held-out test manifests, and checks overlap. Optional fine-tuning learns from the training split and evaluates on the development split; an existing Whisper checkpoint can be used directly. Short clips use Transformers. Long recordings use Silero speech detection, chunks no longer than 30 seconds including padding, faster-whisper with converted CTranslate2 weights, confidence filtering and timestamp merging. Text is retained when word timings are unavailable. In the long-form path, optional pyannote speaker turns are clipped to detected speech and combined with transcript timing to label each segment by its dominant speaker. Held-out reference text enters scoring only. Evaluation uses raw and normalized word and character error rates; optional API predictions can be compared on the same supported audio windows. The project has no trained checkpoint or measured model accuracy; word alignment is unverified.</desc>
