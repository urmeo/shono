[project]
name = "shono"
version = "0.1.1"
description = "Bengali speech transcription and evaluation tools."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "bnunicodenormalizer==0.1.7",
    "jiwer==4.0.0",
]

[project.optional-dependencies]
audio = ["soundfile>=0.13,<0.14", "numpy>=1.26,<3"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.21",
    "ipython>=8.18,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shono"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
