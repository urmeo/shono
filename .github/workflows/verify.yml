name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install 'uv==0.11.21'
      - run: ./verify
      - run: uv build
      - run: scripts/fresh_clone_check.sh
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: 1
      TRANSFORMERS_OFFLINE: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install 'uv==0.11.21'
      - run: uv sync --locked --extra audio
      - run: uv pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install 'transformers==4.52.4' 'accelerate==1.4.0' 'librosa==0.11.0'
      - run: >-
          .venv/bin/python -m pytest -q -W error
          tests/test_train.py::test_smoke_step_runs_one_step_on_cpu
          tests/test_training_integration.py
